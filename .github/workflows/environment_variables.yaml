###################env variables at workflow level
name: env variables at job level and workflow level
on: workflow_dispatch

env: 
   CONTAINER_REGISTRY: docker.io
   DOCKER_USERNAME: subtleactionuser
   IMAGE_NAME: github-actions-nginx  
jobs:
    docker: 
      runs-on: ubuntu-latest
      steps:
      - name: Docker build
        run: echo docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      - name: Docker login
        run: echo docker login --username=$DOCKER_USERNAME --password=${{ secrets.DOCKER_PASSWORD }}
      - name : Docker publish
        run : echo docker push $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

    deploy:
      needs: docker
      runs-on: ubuntu-latest
      steps:       
        - name: Docker run
          run: echo docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest