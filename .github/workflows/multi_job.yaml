name: multi job and upload and download artifact
on: push
jobs:
  build_job_1:
    
    runs-on: ubuntu-latest
    steps:
    - name: install cowsay program
      run: sudo apt-get install cowsay -y

    - name: execute cowsay CMD 
      run: cowsay -f dragon "run for cover" >> dragon.txt
    
    - name: Upload build artefact
      uses: actions/upload-artifact@v7
      with:
        name: dragon-file-text
        path: dragon.txt

  test_job_2:
    needs: build_job_1    # needs to avoid running this job in parallelly with build_job_1
    runs-on: ubuntu-latest
    steps: 
    - name: download build artifact          
      uses: actions/download-artifact@v8
      with:
        name: dragon-file-text
    
    - name: test file exists
      run: grep -i "dragon" dragon.txt

  deploy_job_3:
    needs: [test_job_2, build_job_1]
    runs-on: ubuntu-latest
    steps: 
    - name: download build artifact
      uses: actions/download-artifact@v8
      with:
        name: dragon-file-text

    - name: read file
      run: cat dragon.txt

    - name: deploy
      run: echo "Deploying......"